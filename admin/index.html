<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TEV Admin</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#5d6472;--line:#e1e4ea;--navy:#12284c;--accent:#1f5fbf;--good:#1a7f45;--bad:#b42318;--soft:#eef1f6;--bar:#1f5fbf;--bar2:#9db8e3}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d22;--ink:#eceef2;--muted:#a3aab6;--line:#2c3139;--navy:#86a6d6;--accent:#7fa7e6;--good:#5cc98b;--bad:#f2877d;--soft:#22262d;--bar:#7fa7e6;--bar2:#3c5683}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:.2px}
h2{margin:0 0 12px;font-size:15px}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{color:#111316}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.delta{font-size:12px;font-variant-numeric:tabular-nums}.up{color:var(--good)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.total td{font-weight:700;background:var(--soft)}
.scroll{overflow-x:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.head h2{margin:0}
.seg{display:flex;gap:4px}
.seg button{padding:4px 10px;font-size:12px}
svg text{fill:var(--muted);font-size:11px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){.btn{color:#111316}}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.center{max-width:420px;margin:12vh auto;text-align:center}
.tx td:nth-child(3){white-space:normal;text-align:left;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center card"><p class="muted">Checking sign-in…</p></div></div>
<script>
(async function(){
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TZ = 'America/Chicago';
  const money = n => '$' + (n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  const money0 = n => '$' + Math.round(n || 0).toLocaleString('en-US');
  const int = n => Math.round(n || 0).toLocaleString('en-US');

  let s = {};
  try { s = await fetch('/api/auth/session', {cache:'no-store'}).then(r => r.json()); } catch (e) {}
  if (!s.signedIn) {
    app.innerHTML = '<div class="center card"><h1>Texas Eagle Vending Admin</h1><p class="muted">Sign in with the TEV Google account to view the dashboard.</p><a class="btn" href="/api/auth/login">Sign in with Google</a></div>';
    return;
  }

  const get = part => fetch('/api/dash-data?part=' + part, {cache:'no-store'}).then(r => r.json()).then(j => j.data);
  let snap, agg, status, latest;
  try { [snap, agg, status, latest] = await Promise.all([get('snapshot'), get('agg'), get('status'), get('latest&n=20')]); }
  catch (e) { app.innerHTML = '<div class="center card"><p>Could not load data. Try reloading.</p></div>'; return; }
  if (!snap || !agg) { app.innerHTML = '<div class="center card"><p>No data yet. The first refresh has not run.</p></div>'; return; }

  const M = snap.machines;
  const mName = id => (M.find(m => m.id === id) || {}).name || id;
  const pName = id => { const p = snap.products[id]; return p ? (p.alias || p.name) : id; };

  // Dates in Central time, as YYYY-MM-DD strings
  const ymd = d => new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
  const add = (day, n) => { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const today = ymd(new Date());
  const dow = day => new Date(day + 'T12:00:00Z').getUTCDay();
  const monthStart = day => day.slice(0, 8) + '01';
  const monthEnd = day => { const [y, m] = day.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
  const addMonths = (day, n) => { const [y, m, d] = day.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(d, last))).toISOString().slice(0, 10); };
  const label = (a, b) => { const f = x => new Date(x + 'T12:00:00Z').toLocaleDateString('en-US', {month:'short', day:'numeric', timeZone:'UTC'}); return a === b ? f(a) : f(a) + ' – ' + f(b); };

  const periods = {
    today:     () => ({ a: today, b: today, pa: add(today, -7), pb: add(today, -7), vs: 'same day last week' }),
    yesterday: () => { const y = add(today, -1); return { a: y, b: y, pa: add(y, -7), pb: add(y, -7), vs: 'same day last week' }; },
    week:      () => { const a = add(today, -((dow(today) + 6) % 7)); return { a, b: today, pa: add(a, -7), pb: add(today, -7), vs: 'same days last week' }; },
    month:     () => { const a = monthStart(today); return { a, b: today, pa: addMonths(a, -1), pb: addMonths(today, -1), vs: 'same days last month' }; },
    lastmonth: () => { const a = addMonths(monthStart(today), -1), b = monthEnd(a); const pa = addMonths(a, -1); return { a, b, pa, pb: monthEnd(pa), vs: 'the month before' }; },
  };
  const names = {today:'Today', yesterday:'Yesterday', week:'This week', month:'This month', lastmonth:'Last month'};

  function sum(a, b, loc) {
    const t = { o: 0, r: 0, u: 0, byM: {}, byP: {} };
    for (let d = a; d <= b; d = add(d, 1)) {
      const day = agg.days[d]; if (!day) continue;
      for (const [mid, v] of Object.entries(day.m)) {
        if (loc && !mid.startsWith(loc)) continue;
        const x = (t.byM[mid] ||= { o: 0, r: 0, u: 0 }); x.o += v.o; x.r += v.r; x.u += v.u;
        t.o += v.o; t.r += v.r; t.u += v.u;
      }
      for (const [pid, byM] of Object.entries(day.p)) for (const [mid, v] of Object.entries(byM)) {
        if (loc && !locOf(mid, loc)) continue;
        const x = (t.byP[pid] ||= { u: 0, r: 0 }); x.u += v.u; x.r += v.r;
      }
    }
    return t;
  }
  const LOC = { RR: ['B101219', 'B111755'], SA: ['B101231', 'B111750'] };
  const locOf = (mid, loc) => LOC[loc].includes(mid);
  // sum() filters machines by location list
  const sumLoc = (a, b, loc) => {
    if (!loc) return sum(a, b);
    const t = { o: 0, r: 0, u: 0, byM: {}, byP: {} };
    for (let d = a; d <= b; d = add(d, 1)) {
      const day = agg.days[d]; if (!day) continue;
      for (const [mid, v] of Object.entries(day.m)) { if (!LOC[loc].includes(mid)) continue; const x = (t.byM[mid] ||= {o:0,r:0,u:0}); x.o += v.o; x.r += v.r; x.u += v.u; t.o += v.o; t.r += v.r; t.u += v.u; }
      for (const [pid, byM] of Object.entries(day.p)) for (const [mid, v] of Object.entries(byM)) { if (!LOC[loc].includes(mid)) continue; const x = (t.byP[pid] ||= {u:0,r:0}); x.u += v.u; x.r += v.r; }
    }
    return t;
  };
  const fees = t => t.r * 0.0595 + t.o * 0.05;
  const deltaHtml = (cur, prev, vs) => {
    if (!prev) return '<span class="delta muted">no sales ' + esc(vs) + '</span>';
    const pct = (cur - prev) / prev * 100;
    const cls = pct >= 0 ? 'up' : 'down';
    return '<span class="delta ' + cls + '">' + (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(0) + '%</span> <span class="delta muted">vs ' + esc(vs) + '</span>';
  };

  let state = { period: 'month', loc: '', sellers: 'units' };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem('tev-dash') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('tev-dash', JSON.stringify(state)); } catch (e) {} };

  function chart30() {
    const days = []; for (let i = 29; i >= 0; i--) days.push(add(today, -i));
    const vals = days.map(d => { const day = agg.days[d]; let rr = 0, sa = 0; if (day) for (const [mid, v] of Object.entries(day.m)) { if (LOC.RR.includes(mid)) rr += v.r; else sa += v.r; } return { d, rr, sa }; });
    const max = Math.max(50, ...vals.map(v => v.rr + v.sa));
    const step = Math.ceil(max / 4 / 25) * 25, top = step * 4;
    const W = 720, H = 200, L = 40, B = 24, T = 8, bw = (W - L - 8) / days.length;
    const y = v => T + (H - T - B) * (1 - v / top);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">$${v}</text>`; }
    vals.forEach((v, i) => {
      const x = L + i * bw + 2, w = bw - 4;
      const tip = `<title>${label(v.d, v.d)}: ${money(v.rr + v.sa)} (RR ${money(v.rr)}, SA ${money(v.sa)})</title>`;
      g += `<g>${tip}<rect x="${x}" y="${y(v.rr)}" width="${w}" height="${y(0) - y(v.rr)}" fill="var(--bar)" rx="2"/><rect x="${x}" y="${y(v.rr + v.sa)}" width="${w}" height="${y(v.rr) - y(v.rr + v.sa)}" fill="var(--bar2)" rx="2"/></g>`;
      if (i % 5 === 4 || i === 29) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${new Date(v.d + 'T12:00:00Z').toLocaleDateString('en-US', {month:'numeric', day:'numeric', timeZone:'UTC'})}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily sales, last 30 days">${g}</svg>`;
  }

  function render() {
    const P = periods[state.period]();
    const cur = sumLoc(P.a, P.b, state.loc), prev = sumLoc(P.pa, P.pb, state.loc);
    const when = status && status.finishedAt ? new Date(status.finishedAt).toLocaleString('en-US', {timeZone:TZ, month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'not yet';
    const locBtn = (v, t) => `<button data-loc="${v}" aria-pressed="${state.loc === v}">${t}</button>`;

    // machine table
    const ids = M.filter(m => !state.loc || LOC[state.loc].includes(m.id)).map(m => m.id);
    const row = (nm, c, p, cls) => `<tr class="${cls || ''}"><td>${esc(nm)}</td><td>${money(c.r)}</td><td>${int(c.o)}</td><td>${int(c.u)}</td><td>${c.o ? money(c.r / c.o) : '—'}</td><td>${p && p.r ? deltaHtml(c.r, p.r, '').replace(/ <span class="delta muted">vs <\/span>/, '') : '<span class="muted">—</span>'}</td></tr>`;
    let mt = row(state.loc ? (state.loc === 'RR' ? 'Round Rock total' : 'San Antonio total') : 'All 4 machines', cur, prev, 'total');
    for (const id of ids) mt += row(mName(id), cur.byM[id] || {o:0,r:0,u:0}, prev.byM[id], '');

    // sellers
    const active = new Set(); for (const id of ids) for (const [pid, q] of Object.entries((snap.stock || {})[id] || {})) if (q > 0) active.add(pid);
    const all = new Set([...Object.keys(cur.byP), ...active]);
    const rows = [...all].map(pid => ({ pid, u: (cur.byP[pid] || {}).u || 0, r: (cur.byP[pid] || {}).r || 0 }));
    const key = state.sellers === 'units' ? 'u' : 'r';
    const topList = rows.filter(x => x.u > 0).sort((a, b) => b[key] - a[key] || b.u - a.u).slice(0, 10);
    const botList = rows.filter(x => active.has(x.pid)).sort((a, b) => a[key] - b[key] || a.u - b.u).slice(0, 10);
    const sellTable = list => '<table><thead><tr><th>Product</th><th>Units</th><th>Sales</th></tr></thead><tbody>' + (list.length ? list.map(x => `<tr><td>${esc(pName(x.pid))}</td><td>${int(x.u)}</td><td>${money(x.r)}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No sales in this period</td></tr>') + '</tbody></table>';

    // latest transactions
    const lt = (latest || []).filter(x => !state.loc || LOC[state.loc].includes(x.m)).slice(0, 15);
    const txRows = lt.map(x => `<tr><td>${esc(new Date(x.at).toLocaleString('en-US', {timeZone:TZ, month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'}))}</td><td>${esc(mName(x.m))}</td><td>${esc((x.items || []).map(i => (i.q > 1 ? i.q + '× ' : '') + (snap.products[i.p] ? pName(i.p) : i.n) + (i.refund ? ' (refunded)' : '')).join(', '))}</td><td>${money(x.paid)}</td></tr>`).join('');

    app.innerHTML = `
      <header>
        <div><h1>Texas Eagle Vending</h1><div class="muted small">Data as of ${esc(when)}${status && !status.ok ? ' — last refresh failed' : ''} · updates 6 AM, 12 PM, 6 PM, 12 AM</div></div>
        <div style="display:flex;gap:12px;align-items:center"><span class="muted small">${esc(s.email)}</span><form method="post" action="/api/auth/logout" style="margin:0"><button class="link">Sign out</button></form></div>
      </header>
      <div class="head" style="margin:0">
        <div class="tabs" role="group" aria-label="Period">${Object.keys(names).map(k => `<button data-p="${k}" aria-pressed="${state.period === k}">${names[k]}</button>`).join('')}</div>
        <div class="seg" role="group" aria-label="Location">${locBtn('', 'All')}${locBtn('RR', 'Round Rock')}${locBtn('SA', 'San Antonio')}</div>
      </div>
      <div class="muted small" style="margin-top:-6px">${esc(names[state.period])}: ${esc(label(P.a, P.b))}</div>
      <section class="kpis">
        <div class="card kpi"><div class="lbl">Sales</div><div class="num">${money(cur.r)}</div>${deltaHtml(cur.r, prev.r, P.vs)}</div>
        <div class="card kpi"><div class="lbl">Orders</div><div class="num">${int(cur.o)}</div>${deltaHtml(cur.o, prev.o, P.vs)}</div>
        <div class="card kpi"><div class="lbl">Items sold</div><div class="num">${int(cur.u)}</div>${deltaHtml(cur.u, prev.u, P.vs)}</div>
        <div class="card kpi"><div class="lbl">Avg order</div><div class="num">${cur.o ? money(cur.r / cur.o) : '—'}</div><span class="delta muted">sales ÷ orders</span></div>
        <div class="card kpi"><div class="lbl">Est. sales tax</div><div class="num">${money(cur.r - cur.r / 1.0825)}</div><span class="delta muted">8.25% backed out, before exemptions</span></div>
        <div class="card kpi"><div class="lbl">Est. card fees</div><div class="num">${money(fees(cur))}</div><span class="delta muted">5.95% + $0.05 per order</span></div>
      </section>
      <section class="card">
        <h2>By machine</h2>
        <div class="scroll"><table><thead><tr><th>Machine</th><th>Sales</th><th>Orders</th><th>Items</th><th>Avg order</th><th>vs ${esc(P.vs)}</th></tr></thead><tbody>${mt}</tbody></table></div>
      </section>
      <section class="card">
        <div class="head"><h2>Daily sales, last 30 days</h2><span class="small muted"><span style="color:var(--bar)">■</span> Round Rock &nbsp; <span style="color:var(--bar2)">■</span> San Antonio</span></div>
        ${chart30()}
      </section>
      <section class="grid2">
        <div class="card"><div class="head"><h2>Top 10 sellers</h2><div class="seg"><button data-s="units" aria-pressed="${state.sellers === 'units'}">Units</button><button data-s="sales" aria-pressed="${state.sellers === 'sales'}">Dollars</button></div></div>${sellTable(topList)}</div>
        <div class="card"><div class="head"><h2>Bottom 10 (in machines now)</h2></div>${sellTable(botList)}</div>
      </section>
      <section class="card">
        <h2>Latest transactions</h2>
        <div class="scroll"><table class="tx"><thead><tr><th>Time</th><th>Machine</th><th>Items</th><th>Paid</th></tr></thead><tbody>${txRows || '<tr><td colspan="4" class="muted">No recent sales</td></tr>'}</tbody></table></div>
      </section>
      <p class="muted small">View only. Sales are what customers paid, tax included, minus refunds. Profit by product comes in a later step.</p>`;

    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { state.period = b.dataset.p; save(); render(); });
    app.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { state.loc = b.dataset.loc; save(); render(); });
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { state.sellers = b.dataset.s; save(); render(); });
  }
  render();
})();
</script>
</body>
</html>
